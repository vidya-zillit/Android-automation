# Zillit automation configuration.
# Every key can be overridden with a system property, e.g. -Dzillit.apkPath=/path/to.apk
# or an environment variable (ZILLIT_APK_PATH style).

# Appium server
zillit.serverUrl=http://127.0.0.1:4723

# Path to an APK to install (only used when appPackage below is empty —
# appPackage wins because launching the installed app skips the reinstall).
# Clear appPackage below to force a fresh install from this APK.
zillit.apkPath=../ZilliQA.apk

# The app is already installed on the emulator, so tests launch it directly
# (no reinstall). QA flavor id: com.zillit.zillitapp.qa
zillit.appPackage=com.zillit.zillitapp.qa
zillit.appActivity=com.zillit.zillitapp.splash.SplashActivity

# Package prefix used in runtime resource-ids. Leave empty to auto-detect from
# the foreground app (QA flavor resolves to com.zillit.zillitapp.qa).
zillit.resourcePackage=

# Device
zillit.deviceName=Pixel_10_Pro
zillit.udid=emulator-5554

# Google Sheet reporting — Apps Script Web-app URL (see tools/google-apps-script.gs
# for the one-time setup in the sheet). Used by tools/report-to-sheet.mjs.
zillit.sheetWebhook=

# Test data — real project code used by JoinProjectE2ETest. When set, the test
# enters it automatically; leave empty to type it manually on the emulator.
zillit.projectCode=983699
